[project]
name = "lg-soundbar-bluetooth"
version = "0.5.1"
license = "Apache-2.0"
description = "Control LG soundbars over Bluetooth"
authors = [{ name = "jeverley", email = "46714706+jeverley@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["lg", "soundbar", "sound bar", "bluetooth", "rfcomm", "spp", "home automation", "asyncio"]
dynamic = ["classifiers", "dependencies", "optional-dependencies"]

[project.urls]
"Documentation" = "https://lg-soundbar-bluetooth.readthedocs.io"
"Repository" = "https://github.com/jeverley/lg-soundbar-bluetooth"
"Bug Tracker" = "https://github.com/jeverley/lg-soundbar-bluetooth/issues"
"Changelog" = "https://github.com/jeverley/lg-soundbar-bluetooth/blob/main/CHANGELOG.md"

[tool.poetry]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Hardware",
]
packages = [
    { include = "lg_soundbar_bluetooth", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
bluetooth-classic = ">=0.9.0,<0.10"

# Documentation Dependencies
Sphinx = {version = ">=8.1.3,<9", optional = true}
sphinx-rtd-theme = {version = ">=3.1.0,<4", optional = true}
myst-parser = {version = ">=4.0.1,<4.1", optional = true}

[tool.poetry.extras]
docs = [
    "myst-parser",
    "sphinx",
    "sphinx-rtd-theme",
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-cov = "^7.1"
pytest-asyncio = "^1.2.0"

[tool.semantic_release]
branch = "main"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/lg_soundbar_bluetooth/__init__.py:__version__"]
build_command = "pip install poetry && poetry build"
# Breaking changes raise the minor version until 1.0.
major_on_zero = false
# A Conventional Commits message, so commitlint accepts the release commit.
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"

[tool.pytest.ini_options]
addopts = "-v -Wdefault --cov=lg_soundbar_bluetooth --cov-report=term-missing:skip-covered"
pythonpath = ["src"]
log_format = "%(asctime)s.%(msecs)03d %(levelname)-8s %(threadName)s %(name)s:%(filename)s:%(lineno)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@overload",
    "if TYPE_CHECKING",
    "raise NotImplementedError",
]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
mypy_path = "src/"
no_implicit_optional = true
show_error_codes = true
warn_unreachable = true
warn_unused_ignores = true
exclude = [
    'docs/.*',
]

[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true
# Tests check state before and after a frame, which narrowing calls unreachable.
disable_error_code = ["unreachable"]

[[tool.mypy.overrides]]
module = "docs.*"
ignore_errors = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D", "N"]
# Exception names follow Home Assistant style (CannotConnect, NotConnected).
ignore = ["D105", "D107", "N818"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "N802"]
"docs/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["lg_soundbar_bluetooth", "tests"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
